<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --sidebar-bg: #141414;
  --surface: #1c1c1c;
  --surface2: #242424;
  --surface3: #2c2c2c;
  --border: #2e2e2e;
  --text: #e8e8e8;
  --text-muted: #888;
  --text-dim: #555;
  --accent: #7c6af7;
  --accent-hover: #6a58e5;
  --accent-dim: rgba(124,106,247,0.15);
  --ai-bubble: #1c1c1c;
  --danger: #e05454;
  --warning: #f0a500;
  --success: #4caf50;
  --code-bg: #0d1117;
  --star: #f5c518;
}
[data-theme="light"] {
  --bg: #f4f4f4;
  --sidebar-bg: #e8e8e8;
  --surface: #ffffff;
  --surface2: #f0f0f0;
  --surface3: #e4e4e4;
  --border: #d4d4d4;
  --text: #1a1a1a;
  --text-muted: #666;
  --text-dim: #aaa;
  --accent: #5a3ef0;
  --accent-hover: #4a2ee0;
  --accent-dim: rgba(90,62,240,0.1);
  --ai-bubble: #ffffff;
  --code-bg: #f6f8fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
}

/* ===== SIDEBAR ===== */
#sidebar {
  width: 256px;
  min-width: 256px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transition: transform 0.25s ease;
  z-index: 10;
}
#sidebar-top {
  padding: 14px 12px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.app-logo { font-size: 20px; }
#sidebar-top h1 { font-size: 14px; font-weight: 600; flex: 1; }
#new-chat-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
#new-chat-btn:hover { background: var(--accent-hover); }
#conversations-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}
#conversations-list::-webkit-scrollbar { width: 4px; }
#conversations-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.conv-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--text-muted);
  transition: background 0.1s, color 0.1s;
}
.conv-item:hover { background: var(--surface); color: var(--text); }
.conv-item.active { background: var(--surface2); color: var(--text); }
.conv-icon { font-size: 13px; flex-shrink: 0; }
.conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-delete {
  display: none;
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 4px;
  border-radius: 4px;
  opacity: 0.7;
  flex-shrink: 0;
}
.conv-item:hover .conv-delete { display: block; }
.conv-delete:hover { opacity: 1; }
#sidebar-footer {
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}
.sidebar-btn {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 7px;
  padding: 7px 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
  text-align: center;
}
.sidebar-btn:hover { background: var(--surface2); color: var(--text); }

/* ===== MAIN ===== */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#chat-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
}
#hamburger {
  display: none;
  background: none;
  border: none;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  flex-shrink: 0;
}
#chat-title { flex: 1; font-size: 13px; color: var(--text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Model selector button */
#model-selector-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  max-width: 220px;
  white-space: nowrap;
  overflow: hidden;
}
#model-selector-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
#model-name-display { overflow: hidden; text-overflow: ellipsis; }
.model-caret { flex-shrink: 0; font-size: 10px; color: var(--text-muted); }
#header-btns { display: flex; gap: 6px; align-items: center; }
.header-icon-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 6px;
  border-radius: 6px;
  transition: all 0.15s;
}
.header-icon-btn:hover { background: var(--surface2); color: var(--text); }

/* ===== MESSAGES ===== */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.message-row {
  display: flex;
  gap: 10px;
  max-width: 820px;
  margin: 0 auto;
  width: 100%;
  padding: 3px 0;
}
.message-row.user { justify-content: flex-end; }
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
  margin-top: 5px;
}
.user .avatar { background: var(--accent); color: #fff; order: 2; }
.ai .avatar { background: var(--surface3); color: var(--text); font-size: 13px; }
.bubble {
  max-width: 76%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.65;
  word-break: break-word;
}
.user .bubble {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.ai .bubble {
  background: var(--ai-bubble);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  min-width: 48px;
}
/* Markdown */
.bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin: 12px 0 5px; font-weight: 600; }
.bubble h1 { font-size: 17px; } .bubble h2 { font-size: 15px; } .bubble h3 { font-size: 14px; }
.bubble p { margin: 5px 0; }
.bubble ul,.bubble ol { margin: 5px 0 5px 18px; }
.bubble li { margin: 2px 0; }
.bubble a { color: var(--accent); text-decoration: underline; }
.bubble blockquote { border-left: 3px solid var(--border); padding-left: 10px; color: var(--text-muted); margin: 7px 0; }
.bubble table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
.bubble th,.bubble td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; }
.bubble th { background: var(--surface2); }
/* Code */
.code-wrapper { position: relative; margin: 8px 0; border-radius: 9px; overflow: hidden; background: var(--code-bg); border: 1px solid var(--border); }
.code-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
.code-actions { display: flex; gap: 5px; }
.code-btn { background: var(--surface2); border: none; color: var(--text-muted); font-size: 11px; padding: 3px 8px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
.code-btn:hover { background: var(--accent); color: #fff; }
.code-wrapper pre { margin: 0 !important; padding: 12px 14px !important; overflow-x: auto; font-family: 'JetBrains Mono', monospace !important; font-size: 12.5px !important; line-height: 1.6 !important; background: transparent !important; }
.bubble code:not(pre code) { background: var(--surface3); padding: 1px 5px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
/* Typing */
.typing-dots { display: flex; align-items: center; gap: 4px; padding: 4px 0; }
.typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: tdot 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes tdot { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

/* ===== EMPTY STATE ===== */
#empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px; text-align: center; }
#empty-state .logo { font-size: 44px; }
#empty-state h2 { font-size: 19px; font-weight: 600; }
#empty-state p { font-size: 13px; color: var(--text-muted); max-width: 320px; line-height: 1.6; }
.suggestion-chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 10px; }
.chip { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 13px; border-radius: 20px; font-size: 12.5px; cursor: pointer; transition: all 0.15s; }
.chip:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ===== INPUT ===== */
#input-area { padding: 12px 16px 16px; border-top: 1px solid var(--border); }
#input-wrap {
  max-width: 820px; margin: 0 auto;
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 13px; padding: 9px 9px 9px 14px;
  transition: border-color 0.15s;
}
#input-wrap:focus-within { border-color: var(--accent); }
#user-input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; resize: none; max-height: 180px; line-height: 1.6; }
#user-input::placeholder { color: var(--text-dim); }
#send-btn { background: var(--accent); border: none; color: #fff; width: 34px; height: 34px; border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, transform 0.1s; }
#send-btn:hover { background: var(--accent-hover); }
#send-btn:active { transform: scale(0.94); }
#send-btn:disabled { background: var(--border); cursor: not-allowed; }
#send-btn svg { width: 15px; height: 15px; fill: currentColor; }
#input-hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 7px; }

/* ===== MODEL PICKER MODAL ===== */
#model-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); z-index: 500;
  align-items: flex-start; justify-content: flex-end;
  padding: 60px 16px 0;
}
#model-modal.open { display: flex; }
#model-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 440px;
  max-height: calc(100dvh - 80px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#model-panel-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
#model-panel-header h3 { flex: 1; font-size: 14px; font-weight: 600; }
#model-panel-close {
  background: none; border: none; color: var(--text-muted);
  font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 5px;
}
#model-panel-close:hover { background: var(--surface2); color: var(--text); }

/* Tabs */
.model-tabs { display: flex; padding: 10px 12px 0; gap: 2px; }
.model-tab {
  flex: 1; background: none; border: none; color: var(--text-muted);
  font-size: 12.5px; padding: 7px; cursor: pointer; border-radius: 7px;
  transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.model-tab.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
.model-tab:hover:not(.active) { background: var(--surface2); }

/* Search */
#model-search-wrap {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}
#model-search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  font-family: 'Inter', sans-serif;
}
#model-search:focus { border-color: var(--accent); }
#model-search::placeholder { color: var(--text-dim); }

/* Filter chips */
.filter-row { display: flex; gap: 5px; padding: 6px 12px; overflow-x: auto; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-chip {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-muted); font-size: 11px; padding: 3px 10px;
  border-radius: 20px; cursor: pointer; white-space: nowrap;
  transition: all 0.15s; flex-shrink: 0;
}
.filter-chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.filter-chip:hover:not(.on) { border-color: var(--text-muted); color: var(--text); }

/* Model list */
#model-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}
#model-list::-webkit-scrollbar { width: 4px; }
#model-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.model-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.1s;
}
.model-item:hover { background: var(--surface2); }
.model-item.selected { background: var(--accent-dim); }
.model-info { flex: 1; min-width: 0; }
.model-id { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.model-badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 500;
}
.badge-free { background: rgba(76,175,80,0.2); color: #4caf50; border: 1px solid rgba(76,175,80,0.3); }
.badge-paid { background: rgba(240,165,0,0.15); color: var(--warning); border: 1px solid rgba(240,165,0,0.3); }
.star-btn {
  background: none; border: none; cursor: pointer;
  font-size: 16px; padding: 2px 4px; border-radius: 5px;
  line-height: 1; transition: transform 0.15s;
  color: var(--text-dim);
  flex-shrink: 0;
}
.star-btn.starred { color: var(--star); }
.star-btn:hover { transform: scale(1.2); }
.select-check { font-size: 14px; color: var(--accent); flex-shrink: 0; }
#model-list-empty { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 13px; }
#model-loading { text-align: center; padding: 30px; color: var(--text-muted); font-size: 13px; }

/* ===== HTML PREVIEW MODAL ===== */
#preview-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
#preview-modal.open { display: flex; }
#preview-box { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; width: 100%; max-width: 880px; height: 80dvh; display: flex; flex-direction: column; overflow: hidden; }
#preview-header { display: flex; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); gap: 8px; }
#preview-header span { flex: 1; font-size: 13px; font-weight: 500; }
#preview-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
#preview-close:hover { color: var(--text); }
#preview-frame { flex: 1; border: none; background: #fff; }

/* ===== API KEY MODAL ===== */
#apikey-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 700; align-items: center; justify-content: center; padding: 20px; }
#apikey-modal.open { display: flex; }
#apikey-box { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; width: 100%; max-width: 440px; padding: 26px; }
#apikey-box h3 { font-size: 15px; font-weight: 600; margin-bottom: 7px; }
#apikey-box p { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.6; }
#apikey-box a { color: var(--accent); }
#apikey-input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 9px 13px; border-radius: 8px; font-size: 13px; font-family: 'JetBrains Mono', monospace; outline: none; margin-bottom: 12px; }
#apikey-input:focus { border-color: var(--accent); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.btn-cancel { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.btn-save { background: var(--accent); border: none; color: #fff; padding: 8px 16px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-save:hover { background: var(--accent-hover); }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  #sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
  #sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.4); }
  #hamburger { display: block; }
  .bubble { max-width: 90%; }
  #model-modal { justify-content: center; padding: 60px 10px 0; }
  #model-panel { width: 100%; }
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-top">
    <span class="app-logo">✦</span>
    <h1>AI Chat</h1>
    <button id="new-chat-btn" onclick="newChat()">＋ 新規</button>
  </div>
  <div id="conversations-list"></div>
  <div id="sidebar-footer">
    <button class="sidebar-btn" onclick="toggleTheme()">🌙 テーマ</button>
    <button class="sidebar-btn" onclick="openApiKeyModal()">🔑 APIキー</button>
  </div>
</nav>

<!-- Main -->
<main id="main">
  <header id="chat-header">
    <button id="hamburger" onclick="toggleSidebar()">☰</button>
    <span id="chat-title">会話を選択または新規作成</span>
    <div id="header-btns">
      <button id="model-selector-btn" onclick="openModelModal()" title="AIモデルを選択">
        <span style="font-size:13px">🤖</span>
        <span id="model-name-display">モデル選択</span>
        <span class="model-caret">▼</span>
      </button>
    </div>
  </header>

  <div id="messages">
    <div id="empty-state">
      <div class="logo">✦</div>
      <h2>AI Chatへようこそ</h2>
      <p>OpenRouterを通じて多数の無料AIモデルが使えます。<br>まずAPIキーとモデルを設定してください。</p>
      <div class="suggestion-chips">
        <div class="chip" onclick="sendSuggestion('Pythonでフィボナッチ数列を書いて')">🐍 Pythonコード</div>
        <div class="chip" onclick="sendSuggestion('HTMLとCSSでかっこいいカードUIを作って')">🌐 HTML/CSS</div>
        <div class="chip" onclick="sendSuggestion('機械学習とは何かを簡単に説明して')">🤖 AI解説</div>
        <div class="chip" onclick="sendSuggestion('明日の仕事のメールを丁寧に書いて')">✉️ メール作成</div>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-wrap">
      <textarea id="user-input" placeholder="メッセージを入力... (Shift+Enterで改行)" rows="1"
        oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="input-hint">Enterで送信 · Shift+Enterで改行</div>
  </div>
</main>

<!-- Model Picker Modal -->
<div id="model-modal" onclick="onModalBg(event)">
  <div id="model-panel">
    <div id="model-panel-header">
      <span style="font-size:16px">🤖</span>
      <h3>AIモデルを選択</h3>
      <button id="model-panel-close" onclick="closeModelModal()">×</button>
    </div>
    <div class="model-tabs">
      <button class="model-tab active" data-tab="all" onclick="switchTab('all',this)">すべて</button>
      <button class="model-tab" data-tab="free" onclick="switchTab('free',this)">無料モデル</button>
      <button class="model-tab" data-tab="fav" onclick="switchTab('fav',this)">⭐ お気に入り</button>
    </div>
    <div id="model-search-wrap">
      <input type="text" id="model-search" placeholder="🔍 モデルを検索..." oninput="filterModels()" />
    </div>
    <div class="filter-row" id="provider-filters"></div>
    <div id="model-list">
      <div id="model-loading">モデル一覧を読み込み中...</div>
    </div>
  </div>
</div>

<!-- HTML Preview Modal -->
<div id="preview-modal">
  <div id="preview-box">
    <div id="preview-header">
      <span>HTMLプレビュー</span>
      <button id="preview-close" onclick="closePreview()">×</button>
    </div>
    <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<!-- API Key Modal -->
<div id="apikey-modal">
  <div id="apikey-box">
    <h3>🔑 OpenRouter APIキーを設定</h3>
    <p>OpenRouterで無料のAPIキーを取得できます。<br>
      無料モデルは課金なしで使えます。<br>
      <a href="https://openrouter.ai/keys" target="_blank">→ openrouter.ai/keys</a>
    </p>
    <input type="password" id="apikey-input" placeholder="sk-or-..." />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeApiKeyModal()">キャンセル</button>
      <button class="btn-save" onclick="saveApiKey()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let conversations = {};
let currentConvId = null;
let selectedModel = 'meta-llama/llama-3.1-8b-instruct:free';
let selectedModelName = 'Llama 3.1 8B (Free)';
let allModels = [];
let favorites = [];
let currentTab = 'all';
let activeProviderFilter = null;

const COOKIE_KEY = 'aichat_v2';
const MAX_COOKIE = 3800;

// ===== COOKIE =====
function saveCookie() {
  try {
    let data = JSON.stringify({ conversations, currentConvId, selectedModel, selectedModelName, favorites });
    while (data.length > MAX_COOKIE) {
      const ids = Object.keys(conversations);
      if (!ids.length) break;
      const oldest = ids[0];
      const msgs = conversations[oldest]?.messages;
      if (msgs && msgs.length > 2) msgs.splice(0, 2);
      else delete conversations[oldest];
      data = JSON.stringify({ conversations, currentConvId, selectedModel, selectedModelName, favorites });
    }
    const exp = new Date(Date.now() + 30*24*60*60*1000).toUTCString();
    document.cookie = `${COOKIE_KEY}=${encodeURIComponent(data)};expires=${exp};path=/;SameSite=Lax`;
  } catch(e) {}
}
function loadCookie() {
  try {
    const m = document.cookie.match(new RegExp(`(?:^|; )${COOKIE_KEY}=([^;]*)`));
    if (!m) return;
    const d = JSON.parse(decodeURIComponent(m[1]));
    conversations = d.conversations || {};
    currentConvId = d.currentConvId || null;
    if (d.selectedModel) selectedModel = d.selectedModel;
    if (d.selectedModelName) selectedModelName = d.selectedModelName;
    favorites = d.favorites || [];
  } catch(e) {}
}
function getApiKey() {
  const m = document.cookie.match(/(?:^|; )or_api_key=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// ===== CONVERSATIONS =====
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function newChat() {
  const id = genId();
  conversations[id] = { title: '新しい会話', messages: [] };
  currentConvId = id;
  saveCookie();
  renderSidebar();
  renderMessages();
  document.getElementById('chat-title').textContent = '新しい会話';
  closeSidebar();
  document.getElementById('user-input').focus();
}

function switchConv(id) {
  currentConvId = id;
  saveCookie();
  renderSidebar();
  renderMessages();
  document.getElementById('chat-title').textContent = conversations[id]?.title || '';
  closeSidebar();
}

function deleteConv(id, e) {
  e.stopPropagation();
  delete conversations[id];
  if (currentConvId === id) {
    const remaining = Object.keys(conversations);
    currentConvId = remaining.length ? remaining[remaining.length-1] : null;
  }
  saveCookie();
  renderSidebar();
  if (currentConvId) {
    renderMessages();
    document.getElementById('chat-title').textContent = conversations[currentConvId]?.title || '';
  } else {
    renderMessages();
    document.getElementById('chat-title').textContent = '会話を選択または新規作成';
  }
}

function renderSidebar() {
  const list = document.getElementById('conversations-list');
  const ids = Object.keys(conversations).reverse();
  if (!ids.length) {
    list.innerHTML = '<div style="padding:20px 10px;text-align:center;font-size:12px;color:var(--text-muted)">会話がありません</div>';
    return;
  }
  list.innerHTML = ids.map(id => {
    const c = conversations[id];
    const active = id === currentConvId ? 'active' : '';
    const t = (c.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="conv-item ${active}" onclick="switchConv('${id}')">
      <span class="conv-icon">💬</span>
      <span class="conv-title">${t}</span>
      <button class="conv-delete" onclick="deleteConv('${id}',event)" title="削除">🗑</button>
    </div>`;
  }).join('');
}

// ===== MESSAGES =====
function renderMessages() {
  const container = document.getElementById('messages');
  if (!currentConvId || !conversations[currentConvId]?.messages?.length) {
    container.innerHTML = `<div id="empty-state">
      <div class="logo">✦</div>
      <h2>${currentConvId ? '新しい会話' : 'AI Chatへようこそ'}</h2>
      <p>${currentConvId ? '何でも聞いてください。' : 'OpenRouterを通じて多数の無料AIモデルが使えます。<br>まずAPIキーとモデルを設定してください。'}</p>
      <div class="suggestion-chips">
        <div class="chip" onclick="sendSuggestion('Pythonでフィボナッチ数列を書いて')">🐍 Pythonコード</div>
        <div class="chip" onclick="sendSuggestion('HTMLとCSSでかっこいいカードUIを作って')">🌐 HTML/CSS</div>
        <div class="chip" onclick="sendSuggestion('機械学習とは何かを簡単に説明して')">🤖 AI解説</div>
        <div class="chip" onclick="sendSuggestion('明日の仕事のメールを丁寧に書いて')">✉️ メール作成</div>
      </div>
    </div>`;
    return;
  }
  container.innerHTML = conversations[currentConvId].messages
    .map(m => buildMsgHtml(m.role, m.content)).join('');
  document.querySelectorAll('.bubble pre code').forEach(el => hljs.highlightElement(el));
  container.scrollTop = container.scrollHeight;
}

function buildMsgHtml(role, content) {
  const isUser = role === 'user';
  const body = isUser
    ? esc(content).replace(/\n/g,'<br>')
    : renderMd(content);
  return `<div class="message-row ${isUser ? 'user' : 'ai'}">
    <div class="avatar">${isUser ? 'U' : '✦'}</div>
    <div class="bubble">${body}</div>
  </div>`;
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderMd(text) {
  const renderer = new marked.Renderer();
  renderer.code = function(code, lang) {
    let codeText = typeof code === 'object' ? code.text : code;
    let language = (typeof code === 'object' ? code.lang : lang) || 'plaintext';
    const isHtml = /^html?$/i.test(language);
    const previewBtn = isHtml ? `<button class="code-btn" onclick="previewHtml(this)">👁 Preview</button>` : '';
    return `<div class="code-wrapper">
      <div class="code-header">
        <span>${language.toUpperCase()}</span>
        <div class="code-actions">${previewBtn}<button class="code-btn" onclick="copyCode(this)">📋 コピー</button></div>
      </div>
      <pre><code class="language-${language}">${esc(codeText)}</code></pre>
    </div>`;
  };
  marked.setOptions({ renderer, breaks: true, gfm: true });
  return marked.parse(text);
}

// ===== SEND =====
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = getApiKey();
  if (!apiKey) { openApiKeyModal(); return; }

  if (!currentConvId) newChat();

  const conv = conversations[currentConvId];
  conv.messages.push({ role: 'user', content: text });
  if (conv.messages.length === 1) {
    conv.title = text.slice(0, 28) + (text.length > 28 ? '…' : '');
    document.getElementById('chat-title').textContent = conv.title;
    renderSidebar();
  }

  input.value = '';
  input.style.height = 'auto';
  renderMessages();
  document.getElementById('send-btn').disabled = true;

  const container = document.getElementById('messages');
  const tid = 'typing-' + Date.now();
  container.insertAdjacentHTML('beforeend', `
    <div id="${tid}" class="message-row ai">
      <div class="avatar">✦</div>
      <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
    </div>`);
  container.scrollTop = container.scrollHeight;

  try {
    const history = conv.messages.slice(0,-1).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.content
    }));
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
      body: JSON.stringify({ message: text, history, model: selectedModel })
    });
    const data = await res.json();
    document.getElementById(tid)?.remove();
    if (!res.ok) throw new Error(data.error || 'APIエラー');
    conv.messages.push({ role: 'assistant', content: data.reply });
    saveCookie();
    renderMessages();
  } catch(err) {
    document.getElementById(tid)?.remove();
    conv.messages.push({ role: 'assistant', content: `❌ エラー: ${err.message}` });
    saveCookie();
    renderMessages();
  } finally {
    document.getElementById('send-btn').disabled = false;
    document.getElementById('user-input').focus();
  }
}

function sendSuggestion(text) {
  document.getElementById('user-input').value = text;
  sendMessage();
}

// ===== CODE =====
function copyCode(btn) {
  const code = btn.closest('.code-wrapper').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✅ コピー済み';
    setTimeout(() => btn.textContent = '📋 コピー', 2000);
  });
}
function previewHtml(btn) {
  const code = btn.closest('.code-wrapper').querySelector('code').textContent;
  document.getElementById('preview-frame').srcdoc = code;
  document.getElementById('preview-modal').classList.add('open');
}
function closePreview() { document.getElementById('preview-modal').classList.remove('open'); }

// ===== MODEL MODAL =====
async function openModelModal() {
  document.getElementById('model-modal').classList.add('open');
  if (!allModels.length) await fetchModels();
  renderModelList();
}
function closeModelModal() { document.getElementById('model-modal').classList.remove('open'); }
function onModalBg(e) { if (e.target === document.getElementById('model-modal')) closeModelModal(); }

async function fetchModels() {
  document.getElementById('model-loading').style.display = 'block';
  try {
    const res = await fetch('/api/models');
    const data = await res.json();
    allModels = (data.data || []).sort((a,b) => {
      // Free models first
      const af = isFree(a), bf = isFree(b);
      if (af && !bf) return -1;
      if (!af && bf) return 1;
      return a.id.localeCompare(b.id);
    });
    renderProviderFilters();
  } catch(e) {
    document.getElementById('model-loading').textContent = 'モデル一覧の取得に失敗しました';
  }
}

function isFree(model) {
  const p = model.pricing;
  if (!p) return false;
  return parseFloat(p.prompt||'0') === 0 && parseFloat(p.completion||'0') === 0;
}

function getProvider(id) { return id.split('/')[0] || id; }

function renderProviderFilters() {
  const providers = [...new Set(allModels.map(m => getProvider(m.id)))].slice(0, 12);
  const container = document.getElementById('provider-filters');
  container.innerHTML = providers.map(p => {
    const on = activeProviderFilter === p ? 'on' : '';
    return `<div class="filter-chip ${on}" onclick="toggleProviderFilter('${p}')">${p}</div>`;
  }).join('');
}

function toggleProviderFilter(p) {
  activeProviderFilter = activeProviderFilter === p ? null : p;
  renderProviderFilters();
  filterModels();
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('model-search').value = '';
  activeProviderFilter = null;
  renderProviderFilters();
  filterModels();
}

function filterModels() {
  const q = document.getElementById('model-search').value.toLowerCase().trim();
  let list = allModels;

  if (currentTab === 'free') list = list.filter(isFree);
  if (currentTab === 'fav') list = list.filter(m => favorites.includes(m.id));
  if (activeProviderFilter) list = list.filter(m => getProvider(m.id) === activeProviderFilter);
  if (q) list = list.filter(m => m.id.toLowerCase().includes(q) || (m.name||'').toLowerCase().includes(q));

  renderModelList(list);
}

function renderModelList(list) {
  const container = document.getElementById('model-list');
  document.getElementById('model-loading')?.remove();

  const models = list !== undefined ? list : allModels;

  if (!models.length) {
    container.innerHTML = '<div id="model-list-empty">該当するモデルがありません</div>';
    return;
  }

  container.innerHTML = models.map(m => {
    const free = isFree(m);
    const badge = free
      ? '<span class="model-badge badge-free">無料</span>'
      : '<span class="model-badge badge-paid">有料</span>';
    const ctx = m.context_length ? `${(m.context_length/1000).toFixed(0)}k ctx` : '';
    const isSel = m.id === selectedModel;
    const isFav = favorites.includes(m.id);
    const starCls = isFav ? 'starred' : '';
    const selCheck = isSel ? '<span class="select-check">✓</span>' : '';
    const name = esc(m.name || m.id);
    const id = esc(m.id);
    return `<div class="model-item ${isSel ? 'selected' : ''}" onclick="selectModel('${m.id.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}')">
      ${selCheck}
      <div class="model-info">
        <div class="model-id">${name}</div>
        <div class="model-meta">${badge}<span>${id}</span>${ctx ? `<span>${ctx}</span>` : ''}</div>
      </div>
      <button class="star-btn ${starCls}" onclick="toggleFav('${m.id.replace(/'/g,"\\'")}',event)" title="お気に入り">⭐</button>
    </div>`;
  }).join('');
}

function selectModel(id, name) {
  selectedModel = id;
  selectedModelName = name;
  document.getElementById('model-name-display').textContent = name.length > 24 ? name.slice(0,22)+'…' : name;
  saveCookie();
  closeModelModal();
}

function toggleFav(id, e) {
  e.stopPropagation();
  const idx = favorites.indexOf(id);
  if (idx === -1) favorites.push(id);
  else favorites.splice(idx, 1);
  saveCookie();
  filterModels();
}

// ===== API KEY =====
function openApiKeyModal() {
  document.getElementById('apikey-modal').classList.add('open');
  const k = getApiKey();
  if (k) document.getElementById('apikey-input').value = k;
}
function closeApiKeyModal() { document.getElementById('apikey-modal').classList.remove('open'); }
function saveApiKey() {
  const key = document.getElementById('apikey-input').value.trim();
  if (!key) return;
  const exp = new Date(Date.now() + 365*24*60*60*1000).toUTCString();
  document.cookie = `or_api_key=${encodeURIComponent(key)};expires=${exp};path=/;SameSite=Lax`;
  closeApiKeyModal();
}

// ===== UI =====
function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,180)+'px'; }
function toggleTheme() {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('theme', h.dataset.theme);
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

document.addEventListener('click', e => {
  if (window.innerWidth <= 640) {
    const sb = document.getElementById('sidebar');
    if (!sb.contains(e.target) && e.target.id !== 'hamburger') closeSidebar();
  }
});

// ===== INIT =====
(function init() {
  document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
  loadCookie();
  renderSidebar();
  document.getElementById('model-name-display').textContent =
    selectedModelName.length > 24 ? selectedModelName.slice(0,22)+'…' : selectedModelName;
  if (currentConvId && conversations[currentConvId]) {
    renderMessages();
    document.getElementById('chat-title').textContent = conversations[currentConvId].title || '';
  }
})();
</script>
</body>
</html>
