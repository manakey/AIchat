<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
/* ===== TOKENS ===== */
:root {
  --bg:#0f0f0f; --sb:#141414; --sf:#1c1c1c; --sf2:#242424; --sf3:#2c2c2c;
  --bd:#2e2e2e; --tx:#e8e8e8; --muted:#888; --dim:#555;
  --ac:#7c6af7; --ac2:#6a58e5; --acd:rgba(124,106,247,.15);
  --danger:#e05454; --warn:#f0a500; --ok:#4caf50;
  --code:#0d1117; --star:#f5c518;
}
[data-theme="light"] {
  --bg:#f4f4f4; --sb:#e8e8e8; --sf:#fff; --sf2:#f0f0f0; --sf3:#e4e4e4;
  --bd:#d0d0d0; --tx:#1a1a1a; --muted:#666; --dim:#aaa;
  --ac:#5a3ef0; --ac2:#4a2ee0; --acd:rgba(90,62,240,.1);
  --code:#f6f8fa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);height:100dvh;display:flex;overflow:hidden}

/* ===== SIDEBAR ===== */
#sidebar{width:252px;min-width:252px;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .25s ease;z-index:10}
#sb-top{padding:12px 10px 10px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.app-name{font-size:14px;font-weight:600;flex:1}
#new-btn{background:var(--ac);color:#fff;border:none;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
#new-btn:hover{background:var(--ac2)}
#conv-list{flex:1;overflow-y:auto;padding:5px}
#conv-list::-webkit-scrollbar{width:3px}
#conv-list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.ci{display:flex;align-items:center;gap:7px;padding:8px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted);transition:background .1s,color .1s}
.ci:hover{background:var(--sf);color:var(--tx)}
.ci.active{background:var(--sf2);color:var(--tx)}
.ci-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-del{display:none;background:none;border:none;color:var(--danger);cursor:pointer;font-size:12px;padding:2px 4px;border-radius:4px;opacity:.7;flex-shrink:0}
.ci:hover .ci-del{display:block}
.ci-del:hover{opacity:1}
#sb-foot{padding:9px 10px;border-top:1px solid var(--bd);display:flex;gap:5px}
.sb-btn{flex:1;background:var(--sf);border:1px solid var(--bd);color:var(--muted);border-radius:7px;padding:7px 5px;cursor:pointer;font-size:11.5px;transition:all .15s;text-align:center;font-family:'Inter',sans-serif}
.sb-btn:hover{background:var(--sf2);color:var(--tx)}

/* ===== MAIN ===== */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#hdr{padding:9px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;min-height:50px}
#burger{display:none;background:none;border:none;color:var(--tx);font-size:17px;cursor:pointer;padding:4px;flex-shrink:0}
#chat-title{flex:1;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Model btn */
#model-btn{display:flex;align-items:center;gap:5px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;max-width:200px}
#model-btn:hover{border-color:var(--ac);background:var(--acd)}
#model-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Icon buttons */
.hdr-btn{background:none;border:1px solid var(--bd);color:var(--muted);cursor:pointer;font-size:12px;padding:5px 9px;border-radius:7px;transition:all .15s;white-space:nowrap;font-family:'Inter',sans-serif}
.hdr-btn:hover{background:var(--sf2);color:var(--tx)}
.hdr-btns{display:flex;gap:5px;align-items:center}

/* ===== MESSAGES ===== */
#msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:1px}
#msgs::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.mrow{display:flex;gap:9px;max-width:800px;margin:0 auto;width:100%;padding:2px 0}
.mrow.user{justify-content:flex-end}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:5px}
.user .av{background:var(--ac);color:#fff;order:2}
.ai .av{background:var(--sf3);color:var(--tx)}
/* SVG icon in avatar */
.av svg{width:13px;height:13px;fill:currentColor}
.bubble{max-width:76%;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.65;word-break:break-word}
.user .bubble{background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.ai .bubble{background:var(--sf);border:1px solid var(--bd);border-bottom-left-radius:4px;min-width:40px}
/* Markdown */
.bubble h1,.bubble h2,.bubble h3{margin:11px 0 4px;font-weight:600}
.bubble h1{font-size:16px}.bubble h2{font-size:15px}.bubble h3{font-size:14px}
.bubble p{margin:4px 0}
.bubble ul,.bubble ol{margin:4px 0 4px 17px}
.bubble li{margin:2px 0}
.bubble a{color:var(--ac);text-decoration:underline}
.bubble blockquote{border-left:3px solid var(--bd);padding-left:9px;color:var(--muted);margin:6px 0}
.bubble table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.bubble th,.bubble td{border:1px solid var(--bd);padding:5px 9px;text-align:left}
.bubble th{background:var(--sf2)}
/* Code */
.cw{margin:7px 0;border-radius:8px;overflow:hidden;background:var(--code);border:1px solid var(--bd)}
.ch{display:flex;align-items:center;justify-content:space-between;padding:5px 11px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd);font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
[data-theme="light"] .ch{background:rgba(0,0,0,.03)}
.ca{display:flex;gap:4px}
.cbtn{background:var(--sf2);border:none;color:var(--muted);font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.cbtn:hover{background:var(--ac);color:#fff}
.cw pre{margin:0!important;padding:11px 13px!important;overflow-x:auto;font-family:'JetBrains Mono',monospace!important;font-size:12.5px!important;line-height:1.6!important;background:transparent!important}
.bubble code:not(pre code){background:var(--sf3);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px}
/* Typing */
.tdots{display:flex;align-items:center;gap:4px;padding:3px 0}
.tdots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:td 1.2s infinite}
.tdots span:nth-child(2){animation-delay:.2s}
.tdots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}

/* ===== EMPTY STATE ===== */
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:40px;text-align:center}
.e-logo{width:48px;height:48px;background:var(--acd);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.e-logo svg{width:26px;height:26px;fill:var(--ac)}
#empty h2{font-size:18px;font-weight:600}
#empty p{font-size:13px;color:var(--muted);max-width:320px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}
.chip{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:7px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;transition:all .15s}
.chip:hover{background:var(--ac);border-color:var(--ac);color:#fff}

/* ===== INPUT ===== */
#inp-area{padding:11px 14px 15px;border-top:1px solid var(--bd)}
#inp-wrap{max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:7px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 8px 8px 13px;transition:border-color .15s}
#inp-wrap:focus-within{border-color:var(--ac)}
#ui{flex:1;background:none;border:none;outline:none;color:var(--tx);font-family:'Inter',sans-serif;font-size:14px;resize:none;max-height:160px;line-height:1.6}
#ui::placeholder{color:var(--dim)}
#send{background:var(--ac);border:none;color:#fff;width:33px;height:33px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
#send:hover{background:var(--ac2)}
#send:active{transform:scale(.93)}
#send:disabled{background:var(--bd);cursor:not-allowed}
#send svg{width:14px;height:14px;fill:currentColor}
#hint{text-align:center;font-size:11px;color:var(--dim);margin-top:6px}

/* ===== MODEL MODAL ===== */
#m-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:flex-start;justify-content:flex-end;padding:58px 14px 0}
#m-modal.open{display:flex}
#m-panel{background:var(--sf);border:1px solid var(--bd);border-radius:13px;width:430px;max-height:calc(100dvh - 72px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#m-hdr{padding:12px 14px 9px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
#m-hdr h3{flex:1;font-size:13.5px;font-weight:600}
#m-close{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 6px;border-radius:4px}
#m-close:hover{background:var(--sf2);color:var(--tx)}
/* Tabs */
.tabs{display:flex;padding:9px 10px 0;gap:2px}
.tab{flex:1;background:none;border:none;color:var(--muted);font-size:12px;padding:6px;cursor:pointer;border-radius:7px;transition:all .15s;font-family:'Inter',sans-serif}
.tab.on{background:var(--acd);color:var(--ac);font-weight:500}
.tab:hover:not(.on){background:var(--sf2)}
/* Search */
#m-search-wrap{padding:9px 10px;border-bottom:1px solid var(--bd)}
#m-search{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:7px 11px;border-radius:7px;font-size:13px;outline:none;font-family:'Inter',sans-serif}
#m-search:focus{border-color:var(--ac)}
#m-search::placeholder{color:var(--dim)}
/* Provider filter */
.frow{display:flex;gap:4px;padding:6px 10px;overflow-x:auto}
.frow::-webkit-scrollbar{display:none}
.fc{background:var(--sf2);border:1px solid var(--bd);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.fc.on{background:var(--acd);border-color:var(--ac);color:var(--ac)}
.fc:hover:not(.on){border-color:var(--muted);color:var(--tx)}
/* Model list */
#m-list{flex:1;overflow-y:auto;padding:5px}
#m-list::-webkit-scrollbar{width:3px}
#m-list::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.mi{display:flex;align-items:center;gap:9px;padding:9px 9px;border-radius:8px;cursor:pointer;transition:background .1s}
.mi:hover{background:var(--sf2)}
.mi.sel{background:var(--acd)}
.mi-info{flex:1;min-width:0}
.mi-name{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:9px;font-weight:500}
.b-free{background:rgba(76,175,80,.2);color:var(--ok);border:1px solid rgba(76,175,80,.3)}
.b-paid{background:rgba(240,165,0,.15);color:var(--warn);border:1px solid rgba(240,165,0,.3)}
.star{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;line-height:1;transition:transform .15s;color:var(--dim);flex-shrink:0}
.star.on{color:var(--star)}
.star:hover{transform:scale(1.25)}
.chk{font-size:13px;color:var(--ac);flex-shrink:0;font-weight:600}
#m-empty{text-align:center;padding:28px 20px;color:var(--muted);font-size:13px}
#m-loading{text-align:center;padding:28px;color:var(--muted);font-size:13px}

/* ===== HTML PREVIEW ===== */
#prev-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;align-items:center;justify-content:center;padding:18px}
#prev-modal.open{display:flex}
#prev-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:860px;height:80dvh;display:flex;flex-direction:column;overflow:hidden}
#prev-hdr{display:flex;align-items:center;padding:10px 13px;border-bottom:1px solid var(--bd);gap:8px}
#prev-hdr span{flex:1;font-size:13px;font-weight:500}
#prev-close{background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 5px;border-radius:4px}
#prev-close:hover{color:var(--tx)}
#prev-frame{flex:1;border:none;background:#fff}

/* ===== API KEY MODAL ===== */
#key-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:700;align-items:center;justify-content:center;padding:18px}
#key-modal.open{display:flex}
#key-box{background:var(--sf);border:1px solid var(--bd);border-radius:12px;width:100%;max-width:430px;padding:24px}
#key-box h3{font-size:14.5px;font-weight:600;margin-bottom:7px}
#key-box p{font-size:12.5px;color:var(--muted);margin-bottom:13px;line-height:1.6}
#key-box a{color:var(--ac)}
#key-inp{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:9px 12px;border-radius:7px;font-size:13px;font-family:'JetBrains Mono',monospace;outline:none;margin-bottom:11px}
#key-inp:focus{border-color:var(--ac)}
.mbtns{display:flex;gap:7px;justify-content:flex-end}
.btn-c{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);padding:7px 15px;border-radius:7px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif}
.btn-s{background:var(--ac);border:none;color:#fff;padding:7px 15px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;font-family:'Inter',sans-serif}
.btn-s:hover{background:var(--ac2)}

/* ===== MOBILE ===== */
@media(max-width:640px){
  #sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.4)}
  #burger{display:block}
  .bubble{max-width:90%}
  #m-modal{justify-content:center;padding:58px 8px 0}
  #m-panel{width:100%}
}
</style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sb-top">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--ac)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span class="app-name">AI Chat</span>
    <button id="new-btn" onclick="newChat()">+ New</button>
  </div>
  <div id="conv-list"></div>
  <div id="sb-foot">
    <button class="sb-btn" onclick="toggleTheme()">Theme</button>
    <button class="sb-btn" onclick="openKeyModal()">API Key</button>
  </div>
</nav>

<!-- Main -->
<main id="main">
  <header id="hdr">
    <button id="burger" onclick="toggleSB()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <span id="chat-title">会話を選択または新規作成</span>
    <div class="hdr-btns">
      <button id="model-btn" onclick="openModelModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14.93V15a1 1 0 00-2 0v1.93A8.001 8.001 0 014.07 13H6a1 1 0 000-2H4.07A8.001 8.001 0 0111 4.07V6a1 1 0 002 0V4.07A8.001 8.001 0 0119.93 11H18a1 1 0 000 2h1.93A8.001 8.001 0 0113 16.93z"/></svg>
        <span id="model-label">モデル選択</span>
        <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <button class="hdr-btn" onclick="toggleTheme()" id="theme-btn">Light</button>
    </div>
  </header>

  <div id="msgs">
    <div id="empty">
      <div class="e-logo">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </div>
      <h2>AI Chat</h2>
      <p>OpenRouterの無料モデルで動くAIチャット。<br>まず API Key と Model を設定してください。</p>
      <div class="chips">
        <div class="chip" onclick="suggest('Pythonでフィボナッチ数列を書いて')">Python コード</div>
        <div class="chip" onclick="suggest('かっこいいカードUIをHTMLとCSSで作って')">HTML / CSS</div>
        <div class="chip" onclick="suggest('機械学習をわかりやすく説明して')">AI 解説</div>
        <div class="chip" onclick="suggest('丁寧な仕事メールを書いて')">メール作成</div>
      </div>
    </div>
  </div>

  <div id="inp-area">
    <div id="inp-wrap">
      <textarea id="ui" placeholder="メッセージを入力... (Shift+Enter で改行)" rows="1"
        oninput="resize(this)" onkeydown="onKey(event)"></textarea>
      <button id="send" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="hint">Enter で送信 &middot; Shift+Enter で改行</div>
  </div>
</main>

<!-- Model Modal -->
<div id="m-modal" onclick="bgClose(event)">
  <div id="m-panel">
    <div id="m-hdr">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="var(--ac)"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14.93V15a1 1 0 00-2 0v1.93A8.001 8.001 0 014.07 13H6a1 1 0 000-2H4.07A8.001 8.001 0 0111 4.07V6a1 1 0 002 0V4.07A8.001 8.001 0 0119.93 11H18a1 1 0 000 2h1.93A8.001 8.001 0 0113 16.93z"/></svg>
      <h3>AI モデルを選択</h3>
      <button id="m-close" onclick="closeModelModal()">x</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="all" onclick="switchTab('all',this)">すべて</button>
      <button class="tab" data-tab="free" onclick="switchTab('free',this)">無料のみ</button>
      <button class="tab" data-tab="fav" onclick="switchTab('fav',this)">お気に入り</button>
    </div>
    <div id="m-search-wrap">
      <input type="text" id="m-search" placeholder="モデルを検索..." oninput="filterModels()">
    </div>
    <div class="frow" id="prov-filters"></div>
    <div id="m-list"><div id="m-loading">読み込み中...</div></div>
  </div>
</div>

<!-- HTML Preview -->
<div id="prev-modal">
  <div id="prev-box">
    <div id="prev-hdr">
      <span>HTML プレビュー</span>
      <button id="prev-close" onclick="closePrev()">x</button>
    </div>
    <iframe id="prev-frame" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<!-- API Key Modal -->
<div id="key-modal">
  <div id="key-box">
    <h3>OpenRouter API Key</h3>
    <p>無料で取得できます。無料モデルは課金なしで使えます。<br>
      <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a> でキーを発行してください。
    </p>
    <input type="password" id="key-inp" placeholder="sk-or-...">
    <div class="mbtns">
      <button class="btn-c" onclick="closeKeyModal()">キャンセル</button>
      <button class="btn-s" onclick="saveKey()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let convs = {}, curId = null;
let selModel = 'meta-llama/llama-3.1-8b-instruct:free';
let selName  = 'Llama 3.1 8B Free';
let allModels = [], favs = [];
let curTab = 'all', provFilter = null;
let serverHasKey = false;

const CK = 'aichat_v3', MAX_CK = 3600;

// ===== COOKIE =====
function saveCK() {
  try {
    let d = JSON.stringify({convs, curId, selModel, selName, favs});
    while (d.length > MAX_CK) {
      const ids = Object.keys(convs);
      if (!ids.length) break;
      const o = ids[0];
      const m = convs[o]?.messages;
      if (m && m.length > 2) m.splice(0, 2);
      else delete convs[o];
      d = JSON.stringify({convs, curId, selModel, selName, favs});
    }
    const exp = new Date(Date.now() + 30*864e5).toUTCString();
    document.cookie = `${CK}=${encodeURIComponent(d)};expires=${exp};path=/;SameSite=Lax`;
  } catch(e) {}
}
function loadCK() {
  try {
    const m = document.cookie.match(new RegExp(`(?:^|; )${CK}=([^;]*)`));
    if (!m) return;
    const d = JSON.parse(decodeURIComponent(m[1]));
    convs = d.convs || {}; curId = d.curId || null;
    if (d.selModel) selModel = d.selModel;
    if (d.selName)  selName  = d.selName;
    favs = d.favs || [];
  } catch(e) {}
}
function getKey() {
  const m = document.cookie.match(/(?:^|; )or_key=([^;]*)/);
  return m ? decodeURIComponent(m[1]) : '';
}

// ===== CONVERSATIONS =====
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);

function newChat() {
  const id = genId();
  convs[id] = { title: '新しい会話', messages: [] };
  curId = id;
  saveCK(); renderSB(); renderMsgs();
  document.getElementById('chat-title').textContent = '新しい会話';
  closeSB();
  document.getElementById('ui').focus();
}

function switchConv(id) {
  curId = id; saveCK(); renderSB(); renderMsgs();
  document.getElementById('chat-title').textContent = convs[id]?.title || '';
  closeSB();
}

function delConv(id, e) {
  e.stopPropagation();
  delete convs[id];
  if (curId === id) {
    const r = Object.keys(convs);
    curId = r.length ? r[r.length-1] : null;
  }
  saveCK(); renderSB();
  if (curId) { renderMsgs(); document.getElementById('chat-title').textContent = convs[curId]?.title || ''; }
  else { renderMsgs(); document.getElementById('chat-title').textContent = '会話を選択または新規作成'; }
}

function renderSB() {
  const el = document.getElementById('conv-list');
  const ids = Object.keys(convs).reverse();
  if (!ids.length) {
    el.innerHTML = '<div style="padding:18px 8px;text-align:center;font-size:12px;color:var(--muted)">会話なし</div>';
    return;
  }
  el.innerHTML = ids.map(id => {
    const c = convs[id], t = esc(c.title||'');
    return `<div class="ci ${id===curId?'active':''}" onclick="switchConv('${id}')">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      <span class="ci-title">${t}</span>
      <button class="ci-del" onclick="delConv('${id}',event)">x</button>
    </div>`;
  }).join('');
}

// ===== MESSAGES =====
function emptyHtml(isNew) {
  return `<div id="empty">
    <div class="e-logo"><svg viewBox="0 0 24 24" fill="var(--ac)"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></div>
    <h2>${isNew ? '新しい会話' : 'AI Chat'}</h2>
    <p>${isNew ? '何でも聞いてください。' : 'OpenRouterの無料モデルで動くAIチャット。<br>まず API Key と Model を設定してください。'}</p>
    <div class="chips">
      <div class="chip" onclick="suggest('Pythonでフィボナッチ数列を書いて')">Python コード</div>
      <div class="chip" onclick="suggest('かっこいいカードUIをHTMLとCSSで作って')">HTML / CSS</div>
      <div class="chip" onclick="suggest('機械学習をわかりやすく説明して')">AI 解説</div>
      <div class="chip" onclick="suggest('丁寧な仕事メールを書いて')">メール作成</div>
    </div>
  </div>`;
}

function renderMsgs() {
  const el = document.getElementById('msgs');
  if (!curId || !convs[curId]?.messages?.length) {
    el.innerHTML = emptyHtml(!!curId); return;
  }
  el.innerHTML = convs[curId].messages.map(m => msgHtml(m.role, m.content)).join('');
  el.querySelectorAll('pre code').forEach(c => hljs.highlightElement(c));
  el.scrollTop = el.scrollHeight;
}

function msgHtml(role, content) {
  const isU = role === 'user';
  const body = isU ? esc(content).replace(/\n/g,'<br>') : renderMd(content);
  const avInner = isU
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>`
    : `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14.93V15a1 1 0 00-2 0v1.93A8 8 0 014.07 13H6a1 1 0 000-2H4.07A8 8 0 0111 4.07V6a1 1 0 002 0V4.07A8 8 0 0119.93 11H18a1 1 0 000 2h1.93A8 8 0 0113 16.93z"/></svg>`;
  return `<div class="mrow ${isU?'user':'ai'}">
    <div class="av">${avInner}</div>
    <div class="bubble">${body}</div>
  </div>`;
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderMd(text) {
  const r = new marked.Renderer();
  r.code = function(code, lang) {
    let ct = typeof code==='object' ? code.text : code;
    let lg = (typeof code==='object' ? code.lang : lang) || 'plaintext';
    const isH = /^html?$/i.test(lg);
    const pBtn = isH ? `<button class="cbtn" onclick="prevHtml(this)">Preview</button>` : '';
    return `<div class="cw">
      <div class="ch"><span>${lg.toUpperCase()}</span>
        <div class="ca">${pBtn}<button class="cbtn" onclick="cpCode(this)">Copy</button></div>
      </div>
      <pre><code class="language-${lg}">${esc(ct)}</code></pre>
    </div>`;
  };
  marked.setOptions({renderer:r, breaks:true, gfm:true});
  return marked.parse(text);
}

// ===== SEND =====
async function send() {
  const inp = document.getElementById('ui');
  const text = inp.value.trim();
  if (!text) return;

  // キー確認: サーバーに環境変数があれば空文字列でOK
  const key = getKey();
  if (!serverHasKey && !key) { openKeyModal(); return; }

  if (!curId) newChat();
  const conv = convs[curId];
  conv.messages.push({ role:'user', content:text });
  if (conv.messages.length === 1) {
    conv.title = text.slice(0,28) + (text.length>28?'…':'');
    document.getElementById('chat-title').textContent = conv.title;
    renderSB();
  }

  inp.value = ''; inp.style.height = 'auto';
  renderMsgs();
  document.getElementById('send').disabled = true;

  const el = document.getElementById('msgs');
  const tid = 'td-' + Date.now();
  el.insertAdjacentHTML('beforeend', `
    <div id="${tid}" class="mrow ai">
      <div class="av"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm1 14.93V15a1 1 0 00-2 0v1.93A8 8 0 014.07 13H6a1 1 0 000-2H4.07A8 8 0 0111 4.07V6a1 1 0 002 0V4.07A8 8 0 0119.93 11H18a1 1 0 000 2h1.93A8 8 0 0113 16.93z"/></svg></div>
      <div class="bubble"><div class="tdots"><span></span><span></span><span></span></div></div>
    </div>`);
  el.scrollTop = el.scrollHeight;

  try {
    // 履歴は直近8件だけ送る（速度改善）
    const history = conv.messages.slice(0,-1).slice(-8).map(m=>({
      role: m.role==='user'?'user':'assistant', content:m.content
    }));

    const body = { message:text, history, model:selModel };
    // ブラウザのキーがあればボディに含める（サーバー側で環境変数を優先）
    if (key) body.apiKey = key;

    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    document.getElementById(tid)?.remove();
    if (!res.ok) throw new Error(data.error || 'APIエラー');
    conv.messages.push({role:'assistant', content:data.reply});
    saveCK(); renderMsgs();
  } catch(err) {
    document.getElementById(tid)?.remove();
    conv.messages.push({role:'assistant', content:`Error: ${err.message}`});
    saveCK(); renderMsgs();
  } finally {
    document.getElementById('send').disabled = false;
    document.getElementById('ui').focus();
  }
}

function suggest(t) { document.getElementById('ui').value=t; send(); }

// ===== CODE =====
function cpCode(btn) {
  const code = btn.closest('.cw').querySelector('code').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent='Copied!';
    setTimeout(()=>btn.textContent='Copy', 2000);
  });
}
function prevHtml(btn) {
  document.getElementById('prev-frame').srcdoc = btn.closest('.cw').querySelector('code').textContent;
  document.getElementById('prev-modal').classList.add('open');
}
function closePrev() { document.getElementById('prev-modal').classList.remove('open'); }

// ===== MODEL MODAL =====
async function openModelModal() {
  document.getElementById('m-modal').classList.add('open');
  if (!allModels.length) await fetchModels();
  filterModels();
}
function closeModelModal() { document.getElementById('m-modal').classList.remove('open'); }
function bgClose(e) { if (e.target===document.getElementById('m-modal')) closeModelModal(); }

async function fetchModels() {
  try {
    const r = await fetch('/api/models');
    const d = await r.json();
    allModels = (d.data||[]).sort((a,b)=>{
      const af=isFree(a), bf=isFree(b);
      if(af&&!bf) return -1; if(!af&&bf) return 1;
      return a.id.localeCompare(b.id);
    });
    renderProvFilters();
  } catch(e) {
    document.getElementById('m-loading').textContent = 'モデル取得失敗';
  }
}

const isFree = m => { const p=m.pricing; return p && parseFloat(p.prompt||'0')===0 && parseFloat(p.completion||'0')===0; };
const getProv = id => id.split('/')[0] || id;

function renderProvFilters() {
  const provs = [...new Set(allModels.map(m=>getProv(m.id)))].slice(0,14);
  document.getElementById('prov-filters').innerHTML = provs.map(p =>
    `<div class="fc ${provFilter===p?'on':''}" onclick="toggleProv('${p}')">${p}</div>`
  ).join('');
}

function toggleProv(p) {
  provFilter = provFilter===p ? null : p;
  renderProvFilters(); filterModels();
}

function switchTab(tab, el) {
  curTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('m-search').value = '';
  provFilter = null; renderProvFilters(); filterModels();
}

function filterModels() {
  const q = document.getElementById('m-search').value.toLowerCase().trim();
  let list = allModels;
  if (curTab==='free') list = list.filter(isFree);
  if (curTab==='fav')  list = list.filter(m=>favs.includes(m.id));
  if (provFilter) list = list.filter(m=>getProv(m.id)===provFilter);
  if (q) list = list.filter(m=>m.id.toLowerCase().includes(q)||(m.name||'').toLowerCase().includes(q));
  renderModelList(list);
}

function renderModelList(list) {
  const el = document.getElementById('m-list');
  document.getElementById('m-loading')?.remove();
  if (!list.length) { el.innerHTML='<div id="m-empty">該当なし</div>'; return; }
  el.innerHTML = list.map(m => {
    const free = isFree(m);
    const badge = free ? '<span class="badge b-free">Free</span>' : '<span class="badge b-paid">Paid</span>';
    const ctx = m.context_length ? `${(m.context_length/1000).toFixed(0)}k` : '';
    const isSel = m.id===selModel, isFav = favs.includes(m.id);
    const name = esc(m.name||m.id), id = esc(m.id);
    const idQ = m.id.replace(/'/g,"\\'"), nameQ = (m.name||m.id).replace(/'/g,"\\'");
    return `<div class="mi ${isSel?'sel':''}" onclick="pickModel('${idQ}','${nameQ}')">
      ${isSel?'<span class="chk">&#10003;</span>':''}
      <div class="mi-info">
        <div class="mi-name">${name}</div>
        <div class="mi-meta">${badge}<span>${id}</span>${ctx?`<span>${ctx}</span>`:''}</div>
      </div>
      <button class="star ${isFav?'on':''}" onclick="toggleFav('${idQ}',event)">&#9733;</button>
    </div>`;
  }).join('');
}

function pickModel(id, name) {
  selModel=id; selName=name;
  const lbl = document.getElementById('model-label');
  lbl.textContent = name.length>22 ? name.slice(0,20)+'...' : name;
  saveCK(); closeModelModal();
}

function toggleFav(id, e) {
  e.stopPropagation();
  const i = favs.indexOf(id);
  if (i===-1) favs.push(id); else favs.splice(i,1);
  saveCK(); filterModels();
}

// ===== API KEY =====
function openKeyModal() {
  document.getElementById('key-modal').classList.add('open');
  const k = getKey();
  if (k) document.getElementById('key-inp').value = k;
}
function closeKeyModal() { document.getElementById('key-modal').classList.remove('open'); }
function saveKey() {
  const k = document.getElementById('key-inp').value.trim();
  if (!k) return;
  const exp = new Date(Date.now()+365*864e5).toUTCString();
  document.cookie = `or_key=${encodeURIComponent(k)};expires=${exp};path=/;SameSite=Lax`;
  closeKeyModal();
}

// ===== UI =====
function onKey(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }
function resize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
function toggleSB() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSB() { document.getElementById('sidebar').classList.remove('open'); }

function toggleTheme() {
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme==='dark' ? 'light' : 'dark';
  localStorage.setItem('theme', h.dataset.theme);
  document.getElementById('theme-btn').textContent = h.dataset.theme==='dark' ? 'Light' : 'Dark';
}

document.addEventListener('click', e=>{
  if(window.innerWidth<=640){
    const sb=document.getElementById('sidebar');
    if(!sb.contains(e.target)&&e.target.id!=='burger') closeSB();
  }
});

// ===== INIT =====
(async function init(){
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-btn').textContent = theme==='dark' ? 'Light' : 'Dark';

  loadCK();
  renderSB();

  const lbl = document.getElementById('model-label');
  lbl.textContent = selName.length>22 ? selName.slice(0,20)+'...' : selName;

  if (curId && convs[curId]) {
    renderMsgs();
    document.getElementById('chat-title').textContent = convs[curId].title || '';
  }

  // サーバーに環境変数のAPIキーがあるか確認
  try {
    const r = await fetch('/api/has-server-key');
    const d = await r.json();
    serverHasKey = d.hasKey;
  } catch(e) {}
})();
</script>
